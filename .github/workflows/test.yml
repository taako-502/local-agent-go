name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go tool tensai version
      - run: go tool temporal --version
